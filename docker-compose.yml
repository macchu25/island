# Fixed project name: every git worktree shares one Postgres container and volume.
name: chemimon
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: chemimon
      POSTGRES_PASSWORD: chemimon
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # TCP check: during first-boot init the temporary server listens on the unix socket only.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "chemimon", "-d", "chemimon_test"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
