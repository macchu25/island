services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: chemimon
      POSTGRES_PASSWORD: chemimon
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
volumes:
  pgdata:
