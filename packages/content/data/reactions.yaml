- id: cu_o2_cu2o
  # Equation from the Cu2O page (no temperature there). The 1000 C step relies on CuO -> Cu2O + O2
  # at about 850-1000 C (RSC Adv. 2016 c6ra22712k; seen only as a search abstract, page 403). REVIEW.
  inputs: [ { chemicalId: cu, coefficient: 4 }, { chemicalId: o2, coefficient: 1 } ]
  outputs: [ { chemicalId: cu2o, coefficient: 2 } ]
  ratio: { min: 4, max: 4 }
  conditions: { temperatureC: { min: 1000, max: 1000 }, environment: [ air, inert ] }
  priority: 2
  durationS: 20
  source: https://en.wikipedia.org/wiki/Copper(I)_oxide
  note: "Oxygen-limited only (cu/o2 = 4). 2Cu + O2 at 1000 C gives NO_REACTION on
    purpose (no CuO rule at 1000 C). 1000 C threshold from an RSC 2016 abstract
    (CuO to Cu2O at 850-1000 C); equilibrium in air is near 1030 C."
  reviewed: true

