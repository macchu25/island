# ===================== Potassium + Oxygen (BRANCH by ratio k/o2) =====================
- id: k_o2_k2o2
  # Potassium with oxygen affords the peroxide.
  inputs: [{ chemicalId: k, coefficient: 2 }, { chemicalId: o2, coefficient: 1 }]
