# CHEMIMON reaction rules: AI drafts for human review (gate G1). All reviewed: false.
#
# Semantics (spec 6.4 + task 4):
# - ratio = count(first)/count(second), inputs sorted by chemicalId ascending (NOT yaml order).
# - Omitted condition axis matches anything. Ranges are inclusive over the grid
#   T: -78/25/200/450/1000/2500 C, P: 1/10/100/200 atm.
# - Highest priority wins, then specificity. Every rule sharing an input set has a
#   distinct priority, so a tie is impossible by construction.
# - Input coefficients are <= 4 (MAX_COUNT_PER_INPUT); otherwise the rule could never run.

# ===================== Hydrogen + Oxygen =====================
- id: h2_o2_spark
  inputs: [{ chemicalId: h2, coefficient: 2 }, { chemicalId: o2, coefficient: 1 }]
  outputs: [{ chemicalId: h2o, coefficient: 2 }]
  conditions: { activation: spark }
  priority: 2
  durationS: 10
  source: https://en.wikipedia.org/wiki/Oxyhydrogen
  reviewed: false

- id: h2_o2_hot
  # Oxyhydrogen autoignition is about 570 C, so the 1000 and 2500 C steps ignite it.
  inputs: [{ chemicalId: h2, coefficient: 2 }, { chemicalId: o2, coefficient: 1 }]
  outputs: [{ chemicalId: h2o, coefficient: 2 }]
  conditions: { temperatureC: { min: 1000, max: 2500 } }
  priority: 1
  durationS: 10
  source: https://en.wikipedia.org/wiki/Oxyhydrogen
  reviewed: false

# ===================== Carbon + Oxygen (BRANCH by ratio c/o2) =====================
- id: c_o2_co2
  inputs: [{ chemicalId: c, coefficient: 1 }, { chemicalId: o2, coefficient: 1 }]
  outputs: [{ chemicalId: co2, coefficient: 1 }]
  conditions: { temperatureC: { min: 450, max: 2500 } }
  priority: 1
  durationS: 15
  source: https://en.wikipedia.org/wiki/Carbon
  reviewed: false

- id: c_o2_co
  # Limited oxygen (c/o2 >= 2) gives carbon monoxide.
  inputs: [{ chemicalId: c, coefficient: 2 }, { chemicalId: o2, coefficient: 1 }]
  outputs: [{ chemicalId: co, coefficient: 2 }]
  ratio: { min: 2, max: 4 }
  conditions: { temperatureC: { min: 450, max: 2500 } }
  priority: 2
  durationS: 15
  source: https://en.wikipedia.org/wiki/Carbon_monoxide
  reviewed: false

# ===================== Carbon monoxide + Oxygen =====================
- id: co_o2_spark
  inputs: [{ chemicalId: co, coefficient: 2 }, { chemicalId: o2, coefficient: 1 }]
  outputs: [{ chemicalId: co2, coefficient: 2 }]
  conditions: { activation: spark }
  priority: 2
  durationS: 10
  source: https://en.wikipedia.org/wiki/Carbon_monoxide
  reviewed: false

- id: co_o2_hot
  inputs: [{ chemicalId: co, coefficient: 2 }, { chemicalId: o2, coefficient: 1 }]
  outputs: [{ chemicalId: co2, coefficient: 2 }]
  conditions: { temperatureC: { min: 1000, max: 2500 } }
  priority: 1
  durationS: 10
  source: https://en.wikipedia.org/wiki/Carbon_monoxide
  reviewed: false

# ===================== Carbon + CO2 / Carbon + Water / CO + Water =====================
- id: c_co2_boudouard
  # Boudouard reaction; CO is the main product above 800 C.
  inputs: [{ chemicalId: c, coefficient: 1 }, { chemicalId: co2, coefficient: 1 }]
  outputs: [{ chemicalId: co, coefficient: 2 }]
  conditions: { temperatureC: { min: 1000, max: 2500 } }
  priority: 1
  durationS: 25
  source: https://en.wikipedia.org/wiki/Carbon_monoxide
  reviewed: false

- id: c_h2o_water_gas
  # Steam over red-hot carbon.
  inputs: [{ chemicalId: c, coefficient: 1 }, { chemicalId: h2o, coefficient: 1 }]
  outputs: [{ chemicalId: co, coefficient: 1 }, { chemicalId: h2, coefficient: 1 }]
  conditions: { temperatureC: { min: 1000, max: 2500 } }
  priority: 1
  durationS: 25
  source: https://en.wikipedia.org/wiki/Water_gas
  reviewed: false

- id: co_h2o_shift
  # High-temperature shift: iron-oxide catalyst, 310-450 C.
  inputs: [{ chemicalId: co, coefficient: 1 }, { chemicalId: h2o, coefficient: 1 }]
  outputs: [{ chemicalId: co2, coefficient: 1 }, { chemicalId: h2, coefficient: 1 }]
  conditions: { temperatureC: { min: 450, max: 450 }, catalyst: [Fe] }
  priority: 1
  durationS: 30
  source: https://en.wikipedia.org/wiki/Water-gas_shift_reaction
  reviewed: false

# ===================== Copper + Oxygen (BRANCH by temperature) =====================
- id: cu_o2_cuo
  # Copper heated in air at 300-800 C gives CuO.
  inputs: [{ chemicalId: cu, coefficient: 2 }, { chemicalId: o2, coefficient: 1 }]
  outputs: [{ chemicalId: cuo, coefficient: 2 }]
  conditions: { temperatureC: { min: 450, max: 450 } }
  priority: 1
  durationS: 20
  source: https://en.wikipedia.org/wiki/Copper(II)_oxide
  reviewed: false

- id: cu_o2_cu2o
  # Equation from the Cu2O page (no temperature there). The 1000 C step relies on CuO -> Cu2O + O2
  # at about 850-1000 C (RSC Adv. 2016 c6ra22712k; seen only as a search abstract, page 403). REVIEW.
  inputs: [{ chemicalId: cu, coefficient: 4 }, { chemicalId: o2, coefficient: 1 }]
  outputs: [{ chemicalId: cu2o, coefficient: 2 }]
  conditions: { temperatureC: { min: 1000, max: 1000 } }
  priority: 2
  durationS: 20
  source: https://en.wikipedia.org/wiki/Copper(I)_oxide
  reviewed: false

- id: cuo_decompose
  # CuO/Cu2O carrier releases gas-phase O2 (chemical looping with oxygen uncoupling).
  # Temperature 850-1000 C from RSC Adv. 2016 c6ra22712k abstract (page 403, not read in full). REVIEW.
  inputs: [{ chemicalId: cuo, coefficient: 4 }]
  outputs: [{ chemicalId: cu2o, coefficient: 2 }, { chemicalId: o2, coefficient: 1 }]
  conditions: { temperatureC: { min: 1000, max: 1000 } }
  priority: 1
  durationS: 30
  source: https://en.wikipedia.org/wiki/Chemical_looping_combustion
  reviewed: false

