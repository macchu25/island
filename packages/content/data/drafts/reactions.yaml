- id: na_h2o_naoh
  inputs: [{ chemicalId: na, coefficient: 2 }, { chemicalId: h2o, coefficient: 2 }]
  outputs: [{ chemicalId: naoh, coefficient: 2 }, { chemicalId: h2, coefficient: 1 }]
