# ===================== Sodium + Oxygen (BRANCH by ratio na/o2) =====================
- id: na_o2_na2o2
  # Sodium burned in air gives mainly the peroxide.
  inputs: [{ chemicalId: na, coefficient: 2 }, { chemicalId: o2, coefficient: 1 }]
  outputs: [{ chemicalId: na2o2, coefficient: 1 }]
  conditions: { temperatureC: { min: 200, max: 450 } }
  priority: 1
  durationS: 15
  source: https://en.wikipedia.org/wiki/Sodium_oxide
  reviewed: false

- id: na_o2_na2o
  # Limited oxygen (na/o2 = 4) stops at the oxide.
  inputs: [{ chemicalId: na, coefficient: 4 }, { chemicalId: o2, coefficient: 1 }]
  outputs: [{ chemicalId: na2o, coefficient: 2 }]
  ratio: { min: 4, max: 4 }
  conditions: { temperatureC: { min: 200, max: 450 } }
  priority: 2
  durationS: 15
  source: https://en.wikipedia.org/wiki/Sodium_oxide
  reviewed: false

- id: na2o_o2_na2o2
  inputs: [{ chemicalId: na2o, coefficient: 2 }, { chemicalId: o2, coefficient: 1 }]
  outputs: [{ chemicalId: na2o2, coefficient: 2 }]
  conditions: { temperatureC: { min: 200, max: 450 } }
  priority: 1
  durationS: 20
  source: https://en.wikipedia.org/wiki/Sodium_peroxide
  reviewed: false

