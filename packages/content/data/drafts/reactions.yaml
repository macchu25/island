- id: fe2o3_h2_full
  # Direct reduction with hydrogen at 800-1200 C.
  inputs: [{ chemicalId: fe2o3, coefficient: 1 }, { chemicalId: h2, coefficient: 3 }]
  outputs: [{ chemicalId: fe, coefficient: 2 }, { chemicalId: h2o, coefficient: 3 }]
  conditions: { temperatureC: { min: 1000, max: 1000 } }
  priority: 2
  durationS: 50
  source: https://en.wikipedia.org/wiki/Direct_reduced_iron
  reviewed: false

- id: fe3o4_h2_reduce
  inputs: [{ chemicalId: fe3o4, coefficient: 1 }, { chemicalId: h2, coefficient: 4 }]
  outputs: [{ chemicalId: fe, coefficient: 3 }, { chemicalId: h2o, coefficient: 4 }]
  conditions: { temperatureC: { min: 1000, max: 1000 } }
  priority: 1
  durationS: 50
  source: https://en.wikipedia.org/wiki/Direct_reduced_iron
  reviewed: false

# ===================== Hydrogen chloride =====================
- id: h2_cl2_light
  # Triggered by blue light (photochemical chain reaction).
  inputs: [{ chemicalId: h2, coefficient: 1 }, { chemicalId: cl2, coefficient: 1 }]
  outputs: [{ chemicalId: hcl, coefficient: 2 }]
  conditions: { activation: light }
  priority: 2
  durationS: 10
  source: https://en.wikipedia.org/wiki/Hydrogen_chloride
  reviewed: false

- id: h2_cl2_burn
  # Industrial HCl burner: hydrogen burns in chlorine.
  inputs: [{ chemicalId: h2, coefficient: 1 }, { chemicalId: cl2, coefficient: 1 }]
  outputs: [{ chemicalId: hcl, coefficient: 2 }]
  conditions: { activation: spark }
  priority: 1
  durationS: 10
  source: https://en.wikipedia.org/wiki/Hydrogen_chloride
  reviewed: false

# ===================== Nitrogen =====================
- id: n2_h2_haber
  # Haber process: iron catalyst, 400-500 C, 150-250 bar.
  inputs: [{ chemicalId: n2, coefficient: 1 }, { chemicalId: h2, coefficient: 3 }]
  outputs: [{ chemicalId: nh3, coefficient: 2 }]
  conditions: { temperatureC: { min: 450, max: 450 }, pressureAtm: { min: 100, max: 200 }, catalyst: [Fe] }
  priority: 1
  durationS: 60
  source: https://en.wikipedia.org/wiki/Haber_process
  reviewed: false

- id: nh3_o2_burn
  # Uncatalysed combustion gives N2. (With Pt the real product is NO, which needs 5 O2
  # per 4 NH3 and cannot fit the 4-per-input cap, so Pt is excluded here.)
  inputs: [{ chemicalId: nh3, coefficient: 4 }, { chemicalId: o2, coefficient: 3 }]
  outputs: [{ chemicalId: n2, coefficient: 2 }, { chemicalId: h2o, coefficient: 6 }]
  conditions: { activation: spark, catalyst: [none] }
  priority: 1
  durationS: 20
  source: https://en.wikipedia.org/wiki/Ammonia
  reviewed: false
