  reviewed: false

# ===================== Silicon =====================
- id: si_o2_sio2
  # Silicon does not measurably react with air below 900 C.
  inputs: [{ chemicalId: si, coefficient: 1 }, { chemicalId: o2, coefficient: 1 }]
  outputs: [{ chemicalId: sio2, coefficient: 1 }]
  conditions: { temperatureC: { min: 1000, max: 2500 } }
  priority: 1
  durationS: 30
  source: https://en.wikipedia.org/wiki/Silicon
  reviewed: false

# Silica + Carbon (BRANCH by ratio c/sio2)
- id: c_sio2_si
  # Carbothermal reduction in an arc furnace.
  inputs: [{ chemicalId: sio2, coefficient: 1 }, { chemicalId: c, coefficient: 2 }]
  outputs: [{ chemicalId: si, coefficient: 1 }, { chemicalId: co, coefficient: 2 }]
  conditions: { temperatureC: { min: 2500, max: 2500 } }
  priority: 1
  durationS: 45
  source: https://en.wikipedia.org/wiki/Silicon
  reviewed: false

- id: c_sio2_sic
  # Acheson process (1700-2500 C). Excess carbon (c/sio2 >= 3) gives SiC;
  # the Silicon page notes silica is kept in excess to stop SiC forming.
  inputs: [{ chemicalId: sio2, coefficient: 1 }, { chemicalId: c, coefficient: 3 }]
  outputs: [{ chemicalId: sic, coefficient: 1 }, { chemicalId: co, coefficient: 2 }]
  ratio: { min: 3, max: 4 }
  conditions: { temperatureC: { min: 2500, max: 2500 } }
  priority: 2
  durationS: 50
  source: https://en.wikipedia.org/wiki/Acheson_process
  reviewed: false

# ===================== Iron + Oxygen (BRANCH by temperature / spark) =====================
- id: fe_o2_fe2o3
  # Fe2O3 is the oxidation product of iron; it only converts to Fe3O4 at about 1400 C.
  inputs: [{ chemicalId: fe, coefficient: 4 }, { chemicalId: o2, coefficient: 3 }]
  outputs: [{ chemicalId: fe2o3, coefficient: 2 }]
  conditions: { temperatureC: { min: 450, max: 1000 } }
  priority: 1
  durationS: 30
  source: https://en.wikipedia.org/wiki/Iron(III)_oxide
  reviewed: false

- id: fe_o2_hot_fe3o4
  # Above about 1400 C (1670 K) Fe2O3 converts to Fe3O4.
  inputs: [{ chemicalId: fe, coefficient: 3 }, { chemicalId: o2, coefficient: 2 }]
  outputs: [{ chemicalId: fe3o4, coefficient: 1 }]
  conditions: { temperatureC: { min: 2500, max: 2500 } }
  priority: 2
  durationS: 20
  source: https://en.wikipedia.org/wiki/Iron(III)_oxide
  reviewed: false

- id: fe_o2_burn_fe3o4
  # Iron (steel wool) burning in oxygen gives Fe3O4.
  inputs: [{ chemicalId: fe, coefficient: 3 }, { chemicalId: o2, coefficient: 2 }]
  outputs: [{ chemicalId: fe3o4, coefficient: 1 }]
  conditions: { activation: spark }
  priority: 3
  durationS: 15
  source: https://chemguide.co.uk/14to16/rs/burning.html
  reviewed: false

# ===================== Iron + Steam, magnetite oxidation =====================
- id: fe_h2o_steam
  inputs: [{ chemicalId: fe, coefficient: 3 }, { chemicalId: h2o, coefficient: 4 }]
  outputs: [{ chemicalId: fe3o4, coefficient: 1 }, { chemicalId: h2, coefficient: 4 }]
  conditions: { temperatureC: { min: 450, max: 1000 } }
  priority: 1
  durationS: 40
  source: https://en.wikipedia.org/wiki/Iron(II,III)_oxide
  reviewed: false

- id: fe3o4_o2_fe2o3
  # Roasting magnetite in air gives red alpha-Fe2O3.
  inputs: [{ chemicalId: fe3o4, coefficient: 4 }, { chemicalId: o2, coefficient: 1 }]
  outputs: [{ chemicalId: fe2o3, coefficient: 6 }]
  conditions: { temperatureC: { min: 450, max: 1000 } }
  priority: 1
  durationS: 40
  source: https://en.wikipedia.org/wiki/Iron(II,III)_oxide
  reviewed: false

# ===================== Iron(III) oxide + CO (BRANCH by temperature, blast furnace) =====================
- id: co_fe2o3_partial
  # Top of the blast furnace, 200-700 C.
  inputs: [{ chemicalId: fe2o3, coefficient: 3 }, { chemicalId: co, coefficient: 1 }]
  outputs: [{ chemicalId: fe3o4, coefficient: 2 }, { chemicalId: co2, coefficient: 1 }]
  conditions: { temperatureC: { min: 200, max: 450 } }
  priority: 1
  durationS: 40
  source: https://en.wikipedia.org/wiki/Blast_furnace
  reviewed: false

- id: co_fe2o3_full
  inputs: [{ chemicalId: fe2o3, coefficient: 1 }, { chemicalId: co, coefficient: 3 }]
  outputs: [{ chemicalId: fe, coefficient: 2 }, { chemicalId: co2, coefficient: 3 }]
  conditions: { temperatureC: { min: 1000, max: 1000 } }
  priority: 2
  durationS: 50
  source: https://en.wikipedia.org/wiki/Blast_furnace
  reviewed: false

- id: co_fe3o4_reduce
  # Sum of the stepwise reductions Fe3O4 -> FeO -> Fe by CO.
  inputs: [{ chemicalId: fe3o4, coefficient: 1 }, { chemicalId: co, coefficient: 4 }]
  outputs: [{ chemicalId: fe, coefficient: 3 }, { chemicalId: co2, coefficient: 4 }]
  conditions: { temperatureC: { min: 1000, max: 1000 } }
  priority: 1
  durationS: 50
  source: https://en.wikipedia.org/wiki/Direct_reduced_iron
  reviewed: false

