  # Aluminium powder blown into a flame burns fiercely to Al2O3.
  inputs: [{ chemicalId: al, coefficient: 4 }, { chemicalId: o2, coefficient: 3 }]
  outputs: [{ chemicalId: al2o3, coefficient: 2 }]
  conditions: { activation: spark }
  priority: 1
  durationS: 15
